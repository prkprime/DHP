name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test (Java 21, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Local Eclipse MAT Dependencies (Linux)
        if: runner.os != 'Windows'
        run: bash scripts/setup-deps.sh

      - name: Install Local Eclipse MAT Dependencies (Windows)
        if: runner.os == 'Windows'
        run: .\scripts\setup-deps.bat
        shell: cmd

      - name: Build & Test with Maven
        run: mvn -B clean verify --file pom.xml

      - name: Upload Built Artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: dhp-binaries
          path: |
            dhp-cli/target/dhp-cli-*.jar
            dhp-mat-plugin/target/dhp-mat-plugin-*.jar
          if-no-files-found: error
